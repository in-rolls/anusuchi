[project]
name = "anusuchi"
version = "0.1.0"
description = "Statutory caste lists for India, stored as published and parsed into rows"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "pdfplumber>=0.11", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "isort>=5", "flake8>=7"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
skip = "*.pdf,*.png,*.jpg,*.jpeg,*.gif,*.csv,*.tsv,*.json,*.geojson,*.graphml,*.ipynb,*.html,*.svg,*.bib,*.bbl,*.lock,*.parquet,*.rda,*.rds,*.RData,*.dta,*.xlsx,*.xml,*.min.js,*.map,*.log,*.aux"
ignore-words-list = "centre"
