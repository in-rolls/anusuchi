[project]
name = "anusuchi"
version = "0.1.0"
description = "Statutory caste lists for India, stored as published and parsed into rows"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gaurav Sood" }]
keywords = ["caste", "scheduled castes", "scheduled tribes", "OBC", "gazette", "India"]

dependencies = [
    "matplotlib>=3.10",
    "pdfplumber>=0.11",
    "requests>=2.32",
    "wayback>=0.5.1",
]

[project.urls]
Repository = "https://github.com/in-rolls/anusuchi"
Changelog = "https://github.com/in-rolls/anusuchi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "isort>=5", "flake8>=7"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# A repository of data and numbered scripts, not an importable package:
# installing it brings in the dependencies the scripts need.
[tool.setuptools]
packages = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pyright]
venvPath = "."
venv = ".venv"
